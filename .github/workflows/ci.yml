name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            cache-key: macos
          - name: Windows MSVC
            os: windows-latest
            cache-key: windows-msvc-x64
            msvc-arch: x64

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    env:
      CCACHE_DEPEND: '1'

    steps:
      - uses: actions/checkout@v6

      - name: Set up the compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ matrix.cache-key }}
          max-size: 1G
          evict-old-files: job
          install: ${{ runner.os == 'Windows' && 'binary' || 'detect' }}

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: egor-tensin/vs-shell@54e4148eac794e4580591c2e0b7750f14b7891fc # v2
        with:
          arch: ${{ matrix.msvc-arch }}

      # Ninja on both platforms so ccache can launch every compile; the dev
      # scripts' Visual Studio generator on Windows has no launcher hook.
      # /Z7 (Embedded) on Windows: one PDB per target can't be cached per object.
      - name: Configure
        run: >
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Debug -DEACP_CI_BUILD=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ${{ runner.os == 'macOS' && '-DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache' || '' }}
          ${{ runner.os == 'Windows' && '-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded' || '' }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ${{ runner.os == 'Windows' && 'build/Tests/RudderTests.exe' || 'build/Tests/RudderTests' }}
